<!doctype html>
<html lang="es">
<head>
  <!-- Archivo generado con construir.py. Para editar, cambia los archivos de datos/ y vuelve a generarlo. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coaching Companion</title>
  <style>
/* Coaching Companion — estilos. Sin fuentes ni recursos externos. */
:root {
  --fondo: #f4f6f9;
  --tarjeta: #ffffff;
  --texto: #1d2733;
  --tenue: #5b6878;
  --borde: #dbe1e8;
  --primario: #0f5fa8;
  --primario-claro: #e6f0fa;
  --ok: #1d7a46;
  --ok-claro: #e5f4ec;
  --aviso: #8a5a00;
  --aviso-claro: #fff4dc;
  --radio: 10px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--texto);
  background: var(--fondo);
}
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; margin-top: 1.2em; }
h4 { font-size: 1rem; margin-top: 1em; }
p { margin: 0 0 .75em; }

/* Encabezado */
.encabezado {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 24px; background: var(--tarjeta); border-bottom: 1px solid var(--borde);
}
.marca { display: flex; align-items: center; gap: 12px; }
.marca h1 { font-size: 1.15rem; margin: 0; }
.sub { margin: 0; color: var(--tenue); font-size: .88rem; }
.logo {
  width: 38px; height: 38px; border-radius: 9px; background: var(--primario); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 1.2rem;
}

/* Barra de pasos */
.pasos {
  display: flex; gap: 6px; padding: 12px 24px; overflow-x: auto;
  background: var(--tarjeta); border-bottom: 1px solid var(--borde);
  position: sticky; top: 0; z-index: 5;
}
.paso {
  display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: max-content;
  padding: 8px 12px; border: 1px solid var(--borde); border-radius: 999px;
  background: #fff; color: var(--tenue); font: inherit; cursor: pointer;
}
.paso .num {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fondo); font-size: .85rem; font-weight: 600;
}
.paso.listo .num { background: var(--ok-claro); color: var(--ok); }
.paso.activo { border-color: var(--primario); color: var(--primario); background: var(--primario-claro); font-weight: 600; }
.paso.activo .num { background: var(--primario); color: #fff; }

/* Contenido */
.contenido { max-width: 980px; margin: 0 auto; padding: 20px 24px 100px; outline: none; }
.tarjeta {
  background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 20px; margin-bottom: 16px;
}
.ayuda { color: var(--tenue); }
.tenue { color: var(--tenue); font-weight: normal; }
.nota { color: var(--tenue); font-size: .85rem; margin-top: 12px; }
.alerta { background: var(--aviso-claro); color: var(--aviso); padding: 10px 12px; border-radius: 8px; }
.contexto { font-size: .95rem; }
.etq { font-weight: 600; font-size: .85rem; color: var(--tenue); }

/* Campos */
.fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.campo { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .9rem; }
.campo input, .campo textarea, .campo select {
  font: inherit; font-weight: normal; padding: 8px 10px; border: 1px solid var(--borde);
  border-radius: 8px; background: #fff; color: var(--texto); width: 100%;
}
.campo textarea { resize: vertical; }
.campo input:focus, .campo textarea:focus, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--primario); outline-offset: 1px;
}
.campo-notas { margin-top: 16px; }

/* Botones */
.btn {
  font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--primario); background: var(--primario); color: #fff;
}
.btn:hover { filter: brightness(1.08); }
.btn-sec { background: #fff; color: var(--primario); }
.btn-peq { padding: 6px 12px; font-size: .88rem; }
.enlace { background: none; border: 0; padding: 0; color: var(--primario); font: inherit; text-decoration: underline; cursor: pointer; }
.acciones { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.aviso-copia { color: var(--ok); font-weight: 600; }

/* Chips */
.chip {
  display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600;
  background: var(--primario-claro); color: var(--primario); border: 1px solid transparent;
}
.chip-ejemplo { background: var(--aviso-claro); color: var(--aviso); }
.metricas { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.chip-filtro { cursor: pointer; background: #fff; border-color: var(--borde); color: var(--tenue); font-family: inherit; padding: 4px 12px; }
.chip-filtro.activo { background: var(--primario); color: #fff; border-color: var(--primario); }

/* Behaviors */
.lista-behaviors { display: grid; gap: 10px; }
.behavior { padding: 14px; border: 1px solid var(--borde); border-radius: var(--radio); }
.behavior-cabecera { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.behavior:hover { border-color: var(--primario); }
.behavior.elegido { border-color: var(--primario); background: var(--primario-claro); }
.behavior input { margin-top: 4px; }
.behavior p { margin: 6px 0 0; color: var(--tenue); }
.behavior-titulo { margin-bottom: 4px; }
.se-ve-bien { margin-top: 12px; padding-left: 26px; }
.sub-behaviors { display: grid; gap: 6px; margin-top: 6px; }
.sub-behavior {
  display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; cursor: pointer;
  background: #fff; border: 1px solid var(--borde); border-radius: 8px; font-size: .92rem;
}
.sub-behavior input { margin-top: 4px; flex: none; }
.sub-behavior.elegido { border-color: var(--primario); box-shadow: 0 0 0 1px var(--primario); }
.se-ve-bien ul { margin: 4px 0 0; padding-left: 20px; }

/* GROW */
.pestanas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: -1px; }
.pestana {
  font: inherit; padding: 10px; border: 1px solid var(--borde); border-bottom: 0;
  border-radius: var(--radio) var(--radio) 0 0; background: var(--fondo); color: var(--tenue);
  cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: center;
}
.pestana .letra, .smart-campo .letra {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px;
  background: var(--borde); color: var(--texto); font-weight: 700;
}
.pestana.activa { background: var(--tarjeta); color: var(--primario); font-weight: 600; }
.pestana.activa .letra { background: var(--primario); color: #fff; }
.panel-grow { border-top-left-radius: 0; border-top-right-radius: 0; }
.proposito { background: var(--fondo); border-radius: 8px; padding: 12px 14px; }
.proposito p:last-child { margin: 0; }
.preguntas { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.preguntas label, .senales label, .confirmar {
  display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; cursor: pointer;
}
.preguntas label:hover, .senales label:hover { background: var(--fondo); }
.preguntas input, .senales input, .confirmar input { margin-top: 4px; flex: none; }
.preguntas input:checked + span { color: var(--tenue); text-decoration: line-through; text-decoration-color: var(--borde); }
.grupo-causa { border: 1px solid var(--borde); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
.grupo-causa summary { cursor: pointer; }
.grupo-causa[open] summary { margin-bottom: 6px; }

/* Causa raíz */
.rejilla-causas { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
.causa { margin: 0; display: flex; flex-direction: column; }
.causa h3 { margin-top: 0; }
.causa.confirmada { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-claro); }
.prueba { font-size: .88rem; background: var(--fondo); padding: 8px 10px; border-radius: 8px; }
.senales { list-style: none; padding: 0; margin: 0 0 10px; flex: 1; }
.barra { height: 6px; background: var(--fondo); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
.relleno { display: block; height: 100%; width: 0; background: var(--primario); transition: width .2s; }
.confirmar { font-weight: 600; background: var(--fondo); }
.causa.confirmada .confirmar { background: var(--ok-claro); color: var(--ok); }
.sugerencia { background: var(--primario-claro); border-radius: 8px; padding: 10px 14px; }
.sugerencia p { margin: 0; }
.sugerencia .btn { margin-top: 8px; }

/* Ayuda */
.rejilla-estilos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.estilo {
  display: flex; flex-direction: column; gap: 4px; padding: 12px; cursor: pointer;
  border: 1px solid var(--borde); border-radius: var(--radio); font-size: .9rem;
}
.estilo input { position: absolute; opacity: 0; pointer-events: none; }
.estilo.elegido { border-color: var(--primario); background: var(--primario-claro); }
.estilo:focus-within { outline: 2px solid var(--primario); }
.grupo-ayuda { border-top: 1px solid var(--borde); padding-top: 4px; }

/* SMART */
.smart { display: grid; gap: 12px; margin: 14px 0; }
.smart-campo > span:first-child { display: flex; align-items: center; gap: 8px; }
.smart-campo .tenue { font-size: .85rem; }
.revisiones { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.revisiones .ok { color: var(--ok); }
.revisiones .pendiente { color: var(--aviso); }
.resumen {
  white-space: pre-wrap; word-wrap: break-word; background: var(--fondo); padding: 14px;
  border-radius: 8px; font-family: Consolas, "Courier New", monospace; font-size: .85rem; margin: 0;
}

/* Pie fijo */
.pie {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 24px; background: var(--tarjeta); border-top: 1px solid var(--borde);
}
.aviso-guardado { color: var(--tenue); font-size: .82rem; text-align: center; }

@media (max-width: 640px) {
  .encabezado, .pasos, .contenido, .pie { padding-left: 16px; padding-right: 16px; }
  .paso .txt { display: none; }
  .paso.activo .txt { display: inline; }
  .pestanas { grid-template-columns: repeat(2, 1fr); }
  .rejilla-causas { grid-template-columns: 1fr; }
  .sub { display: none; }
}

/* Impresión: solo el resumen */
@media print {
  .encabezado, .pasos, .pie, .tarjeta { display: none !important; }
  .tarjeta:last-child { display: block !important; border: 0; padding: 0; }
  .tarjeta:last-child .acciones, .tarjeta:last-child .ayuda { display: none; }
  .resumen { background: none; font-size: 11pt; }
  body { background: #fff; }
}
.behavior.elegido .chip { background: #fff; }

</style>
</head>
<body>
  <header class="encabezado">
    <div class="marca">
      <span class="logo" aria-hidden="true">G</span>
      <div>
        <h1>Coaching Companion</h1>
        <p class="sub">Asistente para sesiones de coaching con el modelo GROW</p>
      </div>
    </div>
    <button type="button" class="btn btn-sec" id="btn-nueva">Nueva sesión</button>
  </header>

  <nav class="pasos" id="pasos" aria-label="Pasos de la sesión"></nav>

  <main id="contenido" class="contenido" tabindex="-1">
    <!-- Este aviso solo se ve si no se cargaron los archivos de js/ y datos/. -->
    <div class="tarjeta alerta">
      <strong>La herramienta no pudo cargar sus archivos.</strong>
      Abre <strong>coaching-companion.html</strong> (versión en un solo archivo), o asegúrate de tener junto a este
      index.html las carpetas <code>css</code>, <code>datos</code> y <code>js</code>.
    </div>
  </main>

  <footer class="pie" id="pie">
    <button type="button" class="btn btn-sec" id="btn-atras">← Atrás</button>
    <span class="aviso-guardado" id="aviso-guardado"></span>
    <button type="button" class="btn" id="btn-siguiente">Siguiente →</button>
  </footer>

  <!--
    Orden de carga:
    1) datos/   → contenido editable (behaviors, preguntas, causas, estilos)
    2) js/app.js → estado, navegación y utilidades
    3) js/pasos/ → una sección por paso del flujo
    4) js/inicio.js → arranca la aplicación
    Todo funciona abriendo este archivo directamente (sin servidor).
  -->
  <script>/* datos/metricas.js */
/*
 * ============================================================
 *  MÉTRICAS
 * ============================================================
 *  Cualquier behavior se puede trabajar con cualquier métrica.
 *  El supervisor elige en cada sesión qué métrica se busca mejorar.
 * ============================================================
 */
window.CC = window.CC || {};

CC.metricas = [
  { id: "NPS", descripcion: "Net Promoter Score" },
  { id: "7D FCR", descripcion: "El cliente no vuelve a llamar antes de 7 días" },
  { id: "Stay Connected", descripcion: "Cobro a clientes con saldo vencido (past due)" },
  { id: "CRT", descripcion: "Customer Resolution Time" },
  { id: "HSE", descripcion: "Cambios de garantía" },
  { id: "C&A/100", descripcion: "Créditos o ajustes por cada 100 llamadas" }
];

</script>
  <script>/* datos/behaviors.js */
/*
 * ============================================================
 *  BEHAVIORS  (archivo para editar)
 * ============================================================
 *  Behaviors y sub-behaviors oficiales, con el mismo texto en
 *  inglés que la herramienta de registro de coaching.
 *  Faltan behaviors: agrégalos al final de la lista.
 *
 *  Cómo agregar uno nuevo: copia un bloque { ... }, pégalo al
 *  final de la lista (separado por coma) y cambia el texto.
 *
 *  Campos:
 *   id            Identificador corto, sin espacios ni acentos.
 *   nombre        Nombre exacto del behavior (como en la herramienta).
 *   subBehaviors  Lista de sub-behaviors, texto exacto.
 *   descripcion   Qué es el behavior, en una frase (español).
 *   preguntas     Preguntas de autodescubrimiento propias de este
 *                 behavior para cada etapa GROW. Se muestran antes
 *                 que las preguntas generales (datos/preguntas-grow.js).
 *                 goal / reality / options / way (Way forward).
 *   medible       Sugerencia de cómo medir el avance del behavior
 *                 (plan SMART). La métrica se elige en cada sesión:
 *                 cualquier behavior aplica a cualquier métrica.
 *   ejemplo       true = behavior de muestra (etiqueta EJEMPLO).
 *
 *  Plantilla vacía para copiar:
 *
 *  {
 *    id: "",
 *    nombre: "",
 *    subBehaviors: [
 *      ""
 *    ],
 *    descripcion: "",
 *    preguntas: { goal: [], reality: [], options: [], way: [] },
 *    medible: ""
 *  },
 * ============================================================
 */
window.CC = window.CC || {};

CC.behaviors = [
  {
    id: "visual-audit",
    nombre: "Visual Audit",
    subBehaviors: [
      "Complete a visual audit (NBA - previous memos - tenure - usage - rate plan - balance - additional charges) to identify sales offers & adjacent issues, reduce customer effort, or (tenure - previous credits - balance - payment history) prior to negotiating a credit / payment, etc",
      "Complete a visual audit early and access NBA - be prepared to transition to the treatment"
    ],
    descripcion: "Revisar la cuenta al inicio de la interacción (NBA, memos, tenure, uso, plan, balance, cargos, créditos previos e historial de pagos) para anticipar problemas, ofertas y decisiones de crédito o pago.",
    preguntas: {
      goal: [
        "¿Qué te gustaría saber del cliente antes de que termine de explicar su problema?",
        "Si hicieras la auditoría visual en todas tus llamadas, ¿qué cambiaría en la métrica que estamos trabajando?"
      ],
      reality: [
        "Cuéntame qué revisas en la cuenta en los primeros segundos de la llamada.",
        "¿En qué momento abres NBA? ¿Qué pasa cuando lo abres tarde?",
        "En esta llamada, ¿qué información de la cuenta (memos, balance, cargos) te habría ayudado a resolver antes?",
        "Antes de negociar un crédito o un pago, ¿qué revisas de tenure, créditos previos e historial de pagos?"
      ],
      options: [
        "¿Qué orden de revisión podrías seguir siempre para no olvidar nada?",
        "¿Cómo podrías hacer la auditoría mientras escuchas al cliente, sin dejar silencios largos?",
        "¿Qué issues adyacentes u ofertas podrías detectar si revisas uso y plan desde el inicio?"
      ],
      way: [
        "¿Qué vas a revisar primero en cada llamada a partir de hoy?",
        "¿Cómo vas a recordar abrir NBA al inicio?"
      ]
    },
    medible: "Auditoría visual completa y NBA abierto al inicio en 9 de 10 interacciones monitoreadas",
    ejemplo: false
  },
  {
    id: "tools-resources",
    nombre: "Tools & Resources",
    subBehaviors: [
      "Follow the applicable troubleshooting steps to address device and/or service issues",
      "Follow the steps in The Fix to correct a device/service issue",
      "Open NBA at the beginning of the call/chat to gain an understanding of how you want to position the treatment",
      "Pull up and read policy information in C2 to give correct and complete information to the customer related to their resolution",
      "Review and communicate relevant promotions and offers available for the customer",
      "Review Memos to understand previous calls and issues to reduce customer effort and reduce need for asking questions",
      "Use ATLAS The Fix to send instructions - next steps - resolution guarantee",
      "Use Grand Central to send instructions - next steps - resolution guarantee",
      "Utilize and send (via ATLAS The Fix) Common Procedures to educate the customer about how to use their device or service",
      "Utilize and send (via Grand Central) Common Procedures to educate the customer about how to use their device or service"
    ],
    descripcion: "Usar las herramientas y recursos (The Fix, C2, NBA, Memos, ATLAS, Grand Central) para dar una resolución correcta, completa y documentada.",
    preguntas: {
      goal: [
        "¿Qué tan seguro te gustaría sentirte de que la información que das es correcta y completa?",
        "¿Qué impacto quieres lograr en tus rellamadas usando mejor las herramientas?"
      ],
      reality: [
        "Cuando llega un problema de equipo o servicio, ¿qué herramienta abres primero y por qué?",
        "¿En qué casos sigues los pasos de The Fix completos y en cuáles te saltas alguno?",

      options: [

    ejemplo: false

  {

    preguntas: {

      reality: [

      options: [

  {

      goal: [
        "¿Qué quieres que el cliente sepa con certeza cuando cuelga?",
        "¿Qué te gustaría que pasara con las rellamadas por dudas de factura o de seguimiento?"
      ],
      reality: [
        "¿Cómo le explicas hoy al cliente lo que verá en su próxima factura (prorrateos, monto estimado, crédito)?",

      options: [

  <script>/* js/app.js */
/*
 * Núcleo de la aplicación: estado de la sesión, guardado local,
 * navegación entre pasos y utilidades para crear elementos.
 * Los pasos viven en js/pasos/ y se registran con CC.registrarPaso().
 */
window.CC = window.CC || {};

(function () {
  var CLAVE = "coaching-companion:borrador";

  /* ---------- Estado ---------- */
  CC.estadoInicial = function () {
    return {
      paso: 0,
      sesion: { representante: "", supervisor: "", fecha: hoyISO(), metrica: "" },
      behaviorId: "",
      subBehavior: -1,      // índice del sub-behavior elegido
      grow: {
        goal: { marcadas: [], notas: "" },
        reality: { marcadas: [], notas: "" },
        options: { marcadas: [], notas: "" },
        way: { marcadas: [], notas: "" }
      },
      etapaActiva: "goal",
      senales: [],          // ids "causa:indice"
      causas: [],           // ids de causa confirmados
      estilo: "",
      ayudas: [],           // textos de ayuda elegidos
      ayudaOtra: "",
      smart: { s: "", m: "", a: "", r: "", t: "", fechaLimite: "", fechaSeguimiento: "" }
    };
  };

  CC.estado = CC.estadoInicial();

  CC.cargar = function () {
    try {
      var txt = window.localStorage.getItem(CLAVE);
      if (txt) {
        var guardado = JSON.parse(txt);
        CC.estado = combinar(CC.estadoInicial(), guardado);
      }
    } catch (e) { /* sin almacenamiento: se trabaja solo en memoria */ }
  };

  var temporizador = null;
  function escribir() {
    temporizador = null;
    try {
      window.localStorage.setItem(CLAVE, JSON.stringify(CC.estado));
      avisar("Borrador guardado en este navegador");
    } catch (e) { avisar(""); }
  }
  CC.guardar = function () {
    clearTimeout(temporizador);
    temporizador = setTimeout(escribir, 300);
  };
  /* Si se cierra o recarga la página con cambios pendientes, guardarlos ya. */
  window.addEventListener("pagehide", function () { if (temporizador) { clearTimeout(temporizador); escribir(); } });

  CC.reiniciar = function () {
    try { window.localStorage.removeItem(CLAVE); } catch (e) {}
    CC.estado = CC.estadoInicial();
    CC.irA(0);
  };

  /* ---------- Consultas sobre los datos ---------- */
  CC.behaviorActual = function () {
    for (var i = 0; i < CC.behaviors.length; i++) {
      if (CC.behaviors[i].id === CC.estado.behaviorId) return CC.behaviors[i];
    }
    return null;
  };
  CC.subBehaviorActual = function () {
    var b = CC.behaviorActual();
    if (!b || !b.subBehaviors) return "";
    return b.subBehaviors[CC.estado.subBehavior] || "";
  };
  CC.causaPorId = function (id) {
    for (var i = 0; i < CC.causasRaiz.length; i++) if (CC.causasRaiz[i].id === id) return CC.causasRaiz[i];
    return null;
  };
  CC.estiloPorId = function (id) {
    for (var i = 0; i < CC.estilosAprendizaje.length; i++) if (CC.estilosAprendizaje[i].id === id) return CC.estilosAprendizaje[i];
    return null;
  };

  /* ---------- Navegación ---------- */
  CC.pasos = [];
  CC.registrarPaso = function (paso) { CC.pasos.push(paso); };

  CC.irA = function (indice) {
    if (indice < 0 || indice >= CC.pasos.length) return;
    CC.estado.paso = indice;
    CC.guardar();
    CC.dibujar();
    var main = document.getElementById("contenido");
    main.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  };

  CC.dibujar = function () {
    var paso = CC.pasos[CC.estado.paso];
    var nav = document.getElementById("pasos");
    nav.innerHTML = "";
    CC.pasos.forEach(function (p, i) {
      var listo = p.listo ? p.listo() : false;
      var b = CC.el("button", {
        type: "button",
        className: "paso" + (i === CC.estado.paso ? " activo" : "") + (listo ? " listo" : ""),
        onclick: function () { CC.irA(i); },
        "aria-current": i === CC.estado.paso ? "step" : null
      }, [
        CC.el("span", { className: "num" }, [listo && i !== CC.estado.paso ? "✓" : String(i + 1)]),
        CC.el("span", { className: "txt" }, [p.titulo])
      ]);
      nav.appendChild(b);
    });

    var main = document.getElementById("contenido");
    main.innerHTML = "";
    paso.dibujar(main);

    document.getElementById("btn-atras").style.visibility = CC.estado.paso === 0 ? "hidden" : "visible";
    var sig = document.getElementById("btn-siguiente");
    var ultimo = CC.estado.paso === CC.pasos.length - 1;
    sig.style.visibility = ultimo ? "hidden" : "visible";
    sig.textContent = ultimo ? "" : "Siguiente: " + CC.pasos[CC.estado.paso + 1].titulo + " →";
  };

  /* Vuelve a dibujar solo la barra de pasos (para las marcas ✓). */
  CC.refrescarPasos = function () {
    var nav = document.getElementById("pasos");
    var botones = nav.querySelectorAll(".paso");
    CC.pasos.forEach(function (p, i) {
      var listo = p.listo ? p.listo() : false;
      botones[i].classList.toggle("listo", listo);
      botones[i].querySelector(".num").textContent = listo && i !== CC.estado.paso ? "✓" : String(i + 1);
    });
  };

  /* ---------- Utilidades ---------- */
  CC.el = function (etiqueta, attrs, hijos) {
    var n = document.createElement(etiqueta);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "className") n.className = v;
        else if (k.indexOf("on") === 0 && typeof v === "function") n.addEventListener(k.slice(2), v);
        else if (k === "value") n.value = v;
        else if (k === "checked") n.checked = !!v;
        else n.setAttribute(k, v === true ? "" : v);
      });
    }
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined || h === false) return;
      n.appendChild(typeof h === "string" ? document.createTextNode(h) : h);
    });
    return n;
  };

  /* Agrega o quita un valor de una lista del estado. */
  CC.alternar = function (lista, valor, activo) {
    var i = lista.indexOf(valor);
    if (activo && i === -1) lista.push(valor);
    if (!activo && i !== -1) lista.splice(i, 1);
  };

  CC.etiquetaEjemplo = function () {
    return CC.el("span", { className: "chip chip-ejemplo", title: "Behavior de ejemplo: edita datos/behaviors.js" }, ["EJEMPLO"]);
  };

  CC.chipsMetricas = function (metricas) {
    return CC.el("span", { className: "metricas" }, metricas.map(function (m) {
      return CC.el("span", { className: "chip" }, [m]);
    }));
  };

  CC.formatearFecha = function (iso) {
    if (!iso) return "";
    var p = iso.split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
  };

  function hoyISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1); if (m.length < 2) m = "0" + m;
    var dia = String(d.getDate()); if (dia.length < 2) dia = "0" + dia;
    return d.getFullYear() + "-" + m + "-" + dia;
  }
  CC.hoyISO = hoyISO;

  CC.sumarDias = function (iso, dias) {
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2] + dias);
    var m = String(d.getMonth() + 1); if (m.length < 2) m = "0" + m;
    var dia = String(d.getDate()); if (dia.length < 2) dia = "0" + dia;
    return d.getFullYear() + "-" + m + "-" + dia;
  };

  function combinar(base, extra) {
    Object.keys(extra || {}).forEach(function (k) {
      if (base[k] && typeof base[k] === "object" && !Array.isArray(base[k]) && extra[k] && typeof extra[k] === "object") {
        combinar(base[k], extra[k]);
      } else if (k in base) {
        base[k] = extra[k];
      }
    });
    return base;
  }

  function avisar(texto) {
    var a = document.getElementById("aviso-guardado");
    if (a) a.textContent = texto;
  }
})();

</script>

(function () {
  var el = CC.el;

  CC.registrarPaso({
    id: "behavior",

    listo: function () {
      var b = CC.behaviorActual();
      if (!b) return false;
      return !(b.subBehaviors && b.subBehaviors.length) || !!CC.subBehaviorActual();
    },
    dibujar: function (cont) {
      var s = CC.estado.sesion;

      cont.appendChild(el("section", { className: "tarjeta" }, [
        el("h2", {}, ["1. ¿Qué behavior vamos a trabajar?"]),
        el("p", { className: "ayuda" }, [
          "Elige el behavior que observaste en el monitoreo o en las métricas. Las preguntas de los siguientes pasos se adaptan a él."
        ]),
        el("div", { className: "fila-campos" }, [
          campo("Representante", "text", s.representante, function (v) { s.representante = v; }, "Nombre (opcional)"),
          campo("Supervisor", "text", s.supervisor, function (v) { s.supervisor = v; }, "Nombre (opcional)"),
          campo("Fecha", "date", s.fecha, function (v) { s.fecha = v; }),
          selectorMetrica(s)
        ])
      ]));

      var lista = el("div", { className: "lista-behaviors", role: "radiogroup", "aria-label": "Behaviors" });

      function pintarLista() {
        lista.innerHTML = "";
        CC.behaviors.slice().sort(function (x, y) { return x.nombre.localeCompare(y.nombre); }).forEach(function (b) {
          var elegido = b.id === CC.estado.behaviorId;
          lista.appendChild(el("div", { className: "behavior" + (elegido ? " elegido" : "") }, [
           el("label", { className: "behavior-cabecera" }, [
            el("input", {
              type: "radio", name: "behavior", value: b.id, checked: elegido,
              onchange: function () {
                CC.estado.behaviorId = b.id;
                CC.estado.subBehavior = b.subBehaviors && b.subBehaviors.length === 1 ? 0 : -1;
                CC.guardar();
                pintarLista();
                CC.refrescarPasos();
              }
            }),
            el("div", { className: "behavior-cuerpo" }, [
              el("div", { className: "behavior-titulo" }, [
                el("strong", {}, [b.nombre]), " ",
                b.ejemplo ? CC.etiquetaEjemplo() : null
              ]),
              el("p", {}, [b.descripcion])
            ])

          ]));

        ])
      ]));

  /* Sub-behaviors (o, si no tiene, la lista "seVeBien") del behavior elegido. */
  function detalleElegido(b) {
    if (b.subBehaviors && b.subBehaviors.length) {
      var lista = el("div", { className: "sub-behaviors", role: "radiogroup", "aria-label": "Sub-behavior" });
      b.subBehaviors.forEach(function (texto, i) {
        lista.appendChild(el("label", { className: "sub-behavior" + (CC.estado.subBehavior === i ? " elegido" : "") }, [
          el("input", {
            type: "radio", name: "sub-behavior", checked: CC.estado.subBehavior === i,
            onchange: function () {
              CC.estado.subBehavior = i;
              CC.guardar();
              Array.prototype.forEach.call(lista.children, function (c, j) { c.classList.toggle("elegido", j === i); });
              CC.refrescarPasos();

        ]));

      return el("div", { className: "se-ve-bien" }, [

        }, [el("span", { className: "letra" }, [et.letra]), et.nombre + " · " + et.nombreEs]));
      });
      cont.appendChild(pestanas);
      cont.appendChild(panel);

      function pintarEtapa() {
        var et = CC.etapasGrow.filter(function (e) { return e.id === CC.estado.etapaActiva; })[0] || CC.etapasGrow[0];
        var datos = CC.estado.grow[et.id];
        panel.innerHTML = "";

        panel.appendChild(el("div", { className: "proposito" }, [
          el("p", {}, [el("strong", {}, ["Propósito: "]), et.proposito]),

        ]));

        if (b && b.preguntas && b.preguntas[et.id] && b.preguntas[et.id].length) {
          panel.appendChild(el("h3", {}, ["Preguntas para este behavior"]));

        if (et.id === "reality") {

          panel.appendChild(el("p", { className: "ayuda" }, [

          ]));
          CC.causasRaiz.forEach(function (c) {
            panel.appendChild(el("details", { className: "grupo-causa" }, [
              el("summary", {}, [el("strong", {}, [c.nombre]), " · " + c.nombreEs + " — ", el("span", { className: "tenue" }, [c.resumen])]),
              listaPreguntas(c.preguntas, et.id, "c-" + c.id)

        panel.appendChild(el("label", { className: "campo campo-notas" }, [

      function listaPreguntas(preguntas, etapa, prefijo) {
        var datos = CC.estado.grow[etapa];
        return el("ul", { className: "preguntas" }, preguntas.map(function (texto, i) {

                onchange: function (e) { CC.alternar(datos.marcadas, clave, e.target.checked); CC.guardar(); CC.refrescarPasos(); }
              }),
              el("span", {}, [texto])
            ])
          ]);
        }));
      }

      pintarEtapa();
    }
  });
})();

  <script>/* js/pasos/3-causa-raiz.js */
/* Paso 3: identificar la causa raíz con señales observables. */
(function () {
  var el = CC.el;

  CC.registrarPaso({
    id: "causa",
    titulo: "Causa raíz",
    listo: function () { return CC.estado.causas.length > 0; },
    dibujar: function (cont) {
      var sugerencia = el("div", { className: "sugerencia", "aria-live": "polite" });

      cont.appendChild(el("section", { className: "tarjeta" }, [
        el("h2", {}, ["3. ¿Cuál es la causa raíz?"]),
        el("p", { className: "ayuda" }, [
          "Marca las señales que viste en la conversación y en los monitoreos. La herramienta sugiere la causa más probable, pero tú decides: confirma una o varias."
        ]),
        sugerencia
      ]));

      var rejilla = el("div", { className: "rejilla-causas" });
      cont.appendChild(rejilla);

      CC.causasRaiz.forEach(function (c) {
        var confirmada = CC.estado.causas.indexOf(c.id) !== -1;
        var tarjeta = el("section", { className: "tarjeta causa" + (confirmada ? " confirmada" : ""), "data-causa": c.id }, [
          el("h3", {}, [c.nombre, el("span", { className: "tenue" }, [" · " + c.nombreEs])]),
          el("p", {}, [c.resumen]),
          el("p", { className: "prueba" }, [c.pruebaRapida]),
          el("ul", { className: "senales" }, c.senales.map(function (s, i) {
            var clave = c.id + ":" + i;
            return el("li", {}, [el("label", {}, [
              el("input", {
                type: "checkbox", checked: CC.estado.senales.indexOf(clave) !== -1,
                onchange: function (e) { CC.alternar(CC.estado.senales, clave, e.target.checked); CC.guardar(); actualizar(); }
              }),
              el("span", {}, [s])
            ])]);
          })),
          el("div", { className: "barra" }, [el("span", { className: "relleno" })]),
          el("label", { className: "confirmar" }, [
            el("input", {
              type: "checkbox", checked: confirmada,
              onchange: function (e) {
                CC.alternar(CC.estado.causas, c.id, e.target.checked);
                tarjeta.classList.toggle("confirmada", e.target.checked);
                CC.guardar(); CC.refrescarPasos(); actualizar();
              }
            }),
            el("span", {}, ["Confirmar como causa raíz"])
          ])
        ]);
        rejilla.appendChild(tarjeta);
      });

      function actualizar() {
        var conteo = {};
        var maximo = 0;
        CC.causasRaiz.forEach(function (c) {
          var n = CC.estado.senales.filter(function (s) { return s.split(":")[0] === c.id; }).length;
          conteo[c.id] = n;
          if (n > maximo) maximo = n;
          var t = rejilla.querySelector('[data-causa="' + c.id + '"] .relleno');
          if (t) t.style.width = Math.round((n / c.senales.length) * 100) + "%";
        });

        sugerencia.innerHTML = "";
        if (maximo === 0) {
          sugerencia.appendChild(el("p", { className: "tenue" }, ["Marca señales para ver una sugerencia."]));
          return;
        }
        var probables = CC.causasRaiz.filter(function (c) { return conteo[c.id] === maximo; });
        var nombres = probables.map(function (c) { return c.nombre + " (" + c.nombreEs + ")"; }).join(" o ");
        var p = el("p", {}, [
          "Según las señales marcadas, la causa más probable es ",
          el("strong", {}, [nombres]), "."
        ]);
        sugerencia.appendChild(p);
        var sinConfirmar = probables.filter(function (c) { return CC.estado.causas.indexOf(c.id) === -1; });
        if (sinConfirmar.length && CC.estado.causas.length === 0) {
          sugerencia.appendChild(el("button", {
            type: "button", className: "btn btn-peq",
            onclick: function () {
              sinConfirmar.forEach(function (c) { CC.alternar(CC.estado.causas, c.id, true); });
              CC.guardar(); CC.dibujar();
            }
          }, ["Confirmar sugerencia"]));
        }
      }
      actualizar();
    }
  });
})();

</script>

  <script>/* js/pasos/5-plan-smart.js */
/* Paso 5: plan de acción SMART y resumen para copiar a la herramienta de registro. */
(function () {
  var el = CC.el;

  var CRITERIOS = [
    { id: "s", letra: "S", nombre: "Específico", guia: "¿Qué va a hacer exactamente, en qué llamadas o momentos?" },
    { id: "m", letra: "M", nombre: "Medible", guia: "¿Con qué número o métrica sabremos que lo logró?" },
    { id: "a", letra: "A", nombre: "Alcanzable", guia: "¿Qué apoyo tendrá? ¿Es realista con su carga actual?" },
    { id: "r", letra: "R", nombre: "Relevante", guia: "¿Por qué importa para el cliente, la métrica y el representante?" },
    { id: "t", letra: "T", nombre: "Con tiempo definido", guia: "¿Para cuándo y cuándo es el seguimiento?" }
  ];

  CC.registrarPaso({
    id: "plan",
    titulo: "Plan SMART",
    listo: function () {
      var s = CC.estado.smart;
      return CRITERIOS.every(function (c) { return s[c.id].trim() !== ""; }) && !!s.fechaLimite;
    },
    dibujar: function (cont) {
      var s = CC.estado.smart;
      var b = CC.behaviorActual();
      var resumen = el("pre", { className: "resumen", id: "resumen" });
      var revisiones = el("ul", { className: "revisiones" });

      var campos = el("div", { className: "smart" });
      CRITERIOS.forEach(function (c) {
        campos.appendChild(el("label", { className: "campo smart-campo" }, [
          el("span", {}, [el("span", { className: "letra" }, [c.letra]), c.nombre]),
          el("span", { className: "tenue" }, [c.guia]),
          el("textarea", {
            rows: "2", value: s[c.id], "data-criterio": c.id,
            oninput: function (e) { s[c.id] = e.target.value; cambio(); }
          })
        ]));
      });

      var fechas = el("div", { className: "fila-campos" }, [
        campoFecha("Fecha límite del plan", "fechaLimite"),
        campoFecha("Fecha de seguimiento", "fechaSeguimiento")
      ]);

      cont.appendChild(el("section", { className: "tarjeta" }, [
        el("h2", {}, ["5. Plan de acción SMART"]),
        el("p", { className: "ayuda" }, [
          "Escríbelo con las palabras del representante (lo que dijo en Way forward). Puedes partir de un borrador automático y ajustarlo."
        ]),
        el("button", { type: "button", className: "btn btn-sec btn-peq", onclick: sugerir }, ["Llenar borrador en campos vacíos"]),
        campos,
        fechas,
        el("h3", {}, ["Revisión rápida"]),
        revisiones
      ]));

      cont.appendChild(el("section", { className: "tarjeta" }, [
        el("h2", {}, ["Resumen de la sesión"]),
        el("p", { className: "ayuda" }, ["Cópialo y pégalo en la herramienta donde registran las sesiones de coaching."]),
        el("div", { className: "acciones" }, [
          el("button", { type: "button", className: "btn", onclick: copiar }, ["Copiar resumen"]),
          el("button", { type: "button", className: "btn btn-sec", onclick: function () { window.print(); } }, ["Imprimir"]),
          el("span", { className: "aviso-copia", id: "aviso-copia", "aria-live": "polite" })
        ]),
        resumen
      ]));

      function campoFecha(etiqueta, clave) {
        return el("label", { className: "campo" }, [
          el("span", {}, [etiqueta]),
          el("input", { type: "date", value: s[clave], oninput: function (e) { s[clave] = e.target.value; cambio(); } })
        ]);
      }

      function sugerir() {
        var est = CC.estiloPorId(CC.estado.estilo);
        var causas = CC.estado.causas.map(function (id) { var c = CC.causaPorId(id); return c ? c.nombre : id; });
        var ayudas = CC.estado.ayudas.concat(lineas(CC.estado.ayudaOtra));
        if (!s.fechaLimite) s.fechaLimite = CC.sumarDias(CC.estado.sesion.fecha || CC.hoyISO(), 30);
        if (!s.fechaSeguimiento) s.fechaSeguimiento = CC.sumarDias(CC.estado.sesion.fecha || CC.hoyISO(), 7);
        var borrador = {
          s: b ? "Aplicar \"" + b.nombre + "\" en todas las llamadas: " +
            (CC.subBehaviorActual() || (b.seVeBien || []).map(minuscula).join("; ")) : "",
          m: b ? b.medible + (CC.estado.sesion.metrica ? " Llevar " + CC.estado.sesion.metrica + " del valor actual a la meta." : "") : "",
          a: ayudas.length ? "Con apoyo de: " + ayudas.join("; ") + (est ? " (adaptado a estilo " + est.nombre.toLowerCase() + ")" : "") : "",
          r: b ? (CC.estado.sesion.metrica ? "Mejora " + CC.estado.sesion.metrica : "Mejora la experiencia del cliente") +
            (causas.length ? " y atiende la causa raíz identificada (" + causas.join(", ") + ")." : ".") : "",
          t: "Aplicar desde la próxima llamada; seguimiento el " + CC.formatearFecha(s.fechaSeguimiento) + " y cierre del plan el " + CC.formatearFecha(s.fechaLimite) + "."
        };
        CRITERIOS.forEach(function (c) { if (!s[c.id].trim() && borrador[c.id]) s[c.id] = borrador[c.id]; });
        CC.guardar();
        CC.dibujar();
      }

      function cambio() { CC.guardar(); CC.refrescarPasos(); revisar(); resumen.textContent = CC.textoResumen(); }

      function revisar() {
        var checks = [
          { ok: s.s.trim().length > 25, txt: "Específico: describe una acción concreta (no solo \"mejorar\")." },
          { ok: /\d/.test(s.m), txt: "Medible: incluye un número, porcentaje o meta." },
          { ok: s.a.trim() !== "", txt: "Alcanzable: menciona el apoyo o los recursos." },
          { ok: s.r.trim() !== "", txt: "Relevante: explica por qué importa." },
          { ok: !!s.fechaLimite && !!s.fechaSeguimiento, txt: "Con tiempo: tiene fecha límite y fecha de seguimiento." },
          { ok: !s.fechaLimite || !s.fechaSeguimiento || s.fechaSeguimiento <= s.fechaLimite, txt: "El seguimiento es antes de la fecha límite." }
        ];
        revisiones.innerHTML = "";
        checks.forEach(function (c) {
          revisiones.appendChild(el("li", { className: c.ok ? "ok" : "pendiente" }, [(c.ok ? "✓ " : "○ ") + c.txt]));
        });
      }

      function copiar() {
        var texto = CC.textoResumen();
        var aviso = document.getElementById("aviso-copia");
        function exito() { aviso.textContent = "Copiado ✓"; }
        function respaldo() {
          var ta = el("textarea", { value: texto, style: "position:fixed;left:-9999px" });
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); exito(); } catch (e) { aviso.textContent = "Selecciona el texto y cópialo manualmente."; }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(exito, respaldo);
        else respaldo();
      }

      revisar();
      resumen.textContent = CC.textoResumen();
    }
  });

  function lineas(t) { return (t || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
  function minuscula(t) { return t.charAt(0).toLowerCase() + t.slice(1).replace(/\.$/, ""); }

  /* Texto plano con toda la sesión. */
  CC.textoResumen = function () {
    var e = CC.estado, s = e.smart, b = CC.behaviorActual();
    var r = [];
    r.push("SESIÓN DE COACHING (modelo GROW)");
    r.push("Fecha: " + CC.formatearFecha(e.sesion.fecha) +
      (e.sesion.representante ? " | Representante: " + e.sesion.representante : "") +
      (e.sesion.supervisor ? " | Supervisor: " + e.sesion.supervisor : ""));
    if (e.sesion.metrica) r.push("Métrica: " + e.sesion.metrica);
    r.push("Behavior: " + (b ? b.nombre : "(sin elegir)"));
    if (CC.subBehaviorActual()) r.push("Sub-Behavior: " + CC.subBehaviorActual());
    r.push("");
    CC.etapasGrow.forEach(function (et) {
      var notas = e.grow[et.id].notas.trim();
      r.push(et.letra + " - " + et.nombre + ": " + (notas || "—"));
    });
    r.push("");
    var causas = e.causas.map(function (id) { var c = CC.causaPorId(id); return c ? c.nombre + " (" + c.nombreEs + ")" : id; });
    r.push("Causa raíz: " + (causas.join(", ") || "—"));
    var est = CC.estiloPorId(e.estilo);
    r.push("Estilo de aprendizaje: " + (est ? est.nombre : "—"));
    var ayudas = e.ayudas.concat(lineas(e.ayudaOtra));
    r.push("Acciones de apoyo:" + (ayudas.length ? "" : " —"));
    ayudas.forEach(function (a) { r.push("  • " + a); });
    r.push("");
    r.push("PLAN DE ACCIÓN SMART");
    r.push("S (Específico): " + (s.s || "—"));
    r.push("M (Medible): " + (s.m || "—"));
    r.push("A (Alcanzable): " + (s.a || "—"));
    r.push("R (Relevante): " + (s.r || "—"));
    r.push("T (Tiempo): " + (s.t || "—"));
    r.push("Fecha límite: " + (CC.formatearFecha(s.fechaLimite) || "—") + " | Seguimiento: " + (CC.formatearFecha(s.fechaSeguimiento) || "—"));
    return r.join("\n");
  };
})();

</script>
